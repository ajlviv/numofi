name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.4.2
        type: string
        required: true
      play_track:
        description: Optionally upload the AAB to Google Play after publishing
        type: choice
        required: true
        default: none
        options:
          - none
          - internal
          - production

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    environment: release
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Refuse manual runs outside main or a release tag
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Manual release runs must start from main or a vX.Y.Z tag."
          exit 1

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like v1.4.2, was '$RELEASE_TAG'."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag is on main and matches appVersionName
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          git fetch origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::Tag $RELEASE_TAG does not point to a commit on main."
            exit 1
          fi
          FILE_VERSION=$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '\r')
          if [ "$FILE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match gradle.properties appVersionName=$FILE_VERSION. Refusing to build a mislabelled release."
            exit 1
          fi
          {
            echo "### NumoFi $RELEASE_VERSION"
            echo ""
            echo "Tag: \`$RELEASE_TAG\`"
            echo ""
            echo "Commit: \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21'

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release keystore passwords are not configured."
            exit 1
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Verify signing and version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "versionName='$RELEASE_VERSION'"
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n1)
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionCode from the APK."
            exit 1
          fi
          "$JAVA_HOME/bin/jarsigner" -verify "$AAB" > /dev/null
          {
            echo ""
            echo "Version: \`$RELEASE_VERSION\` (\`$VERSION_CODE\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: numofi-release-${{ env.RELEASE_TAG }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$AAB" \
              --title "NumoFi $RELEASE_VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  play:
    name: Upload to Google Play (${{ inputs.play_track }})
    needs: build
    if: ${{ inputs.play_track == 'internal' || inputs.play_track == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    environment: ${{ inputs.play_track == 'production' && 'play-production' || 'play-internal' }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: numofi-release-${{ env.RELEASE_TAG }}
          path: artifacts

      - name: Require Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi

      - name: Create Play release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          printf 'NumoFi %s\n' "$VERSION_NAME" > distribution/whatsnew/whatsnew-en-US
          printf 'NumoFi %s\n' "$VERSION_NAME" > distribution/whatsnew/whatsnew-uk

      - name: Upload bundle
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.financetracker
          releaseFiles: artifacts/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
          releaseName: ${{ needs.build.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew
