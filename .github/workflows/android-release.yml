name: Android release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      destination:
        description: Where to deliver this build
        type: choice
        required: true
        default: firebase
        options:
          - firebase
          - play-internal
          - play-production
      release_notes:
        description: Release notes (defaults to the commit message)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compute version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          MAJOR=$(sed -n 's/^versionMajor=//p' version.properties | tr -d '\r')
          MINOR=$(sed -n 's/^versionMinor=//p' version.properties | tr -d '\r')
          OFFSET=$(sed -n 's/^versionCodeOffset=//p' version.properties | tr -d '\r')
          ATTEMPT=$(( RUN_ATTEMPT - 1 ))
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$OFFSET" ]; then
            echo "::error::version.properties is missing versionMajor, versionMinor or versionCodeOffset."
            exit 1
          fi
          if [ "$ATTEMPT" -gt 9 ]; then
            echo "::error::Run attempt $RUN_ATTEMPT exceeds the attempt window; start a new run."
            exit 1
          fi
          CODE=$(( OFFSET + RUN_NUMBER * 10 + ATTEMPT ))
          NAME="${MAJOR}.${MINOR}.${RUN_NUMBER}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### NumoFi ${NAME} (${CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release keystore passwords are not configured."
            exit 1
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --console=plain

      - name: Verify signing and version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          "$JAVA_HOME/bin/jarsigner" -verify "$AAB" > /dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  distribute-firebase:
    name: Deliver to Firebase App Distribution
    needs: build
    if: ${{ github.event_name == 'push' || inputs.destination == 'firebase' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.run_id }}
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Distribute APK
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID:-}" ] || [ -z "${FIREBASE_TESTER_GROUPS:-}" ]; then
            echo "::error::FIREBASE_APP_ID and FIREBASE_TESTER_GROUPS repository variables are required."
            exit 1
          fi
          NOTES="${INPUT_NOTES:-$COMMIT_MESSAGE}"
          {
            echo "NumoFi $VERSION_NAME ($VERSION_CODE)"
            echo
            echo "$NOTES"
          } > "$RUNNER_TEMP/release-notes.txt"
          firebase appdistribution:distribute \
            artifacts/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          {
            echo ""
            echo "Delivered to Firebase App Distribution group(s): $FIREBASE_TESTER_GROUPS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  play-internal:
    name: Upload to Play internal testing
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destination == 'play-internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-internal
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.run_id }}
          path: artifacts

      - name: Create Play release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          NOTES="${INPUT_NOTES:-NumoFi $VERSION_NAME}"
          printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-en-US
          printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-uk

      - name: Upload bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.financetracker
          releaseFiles: artifacts/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.build.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew

  play-production:
    name: Upload to Play production
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destination == 'play-production' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: play-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.run_id }}
          path: artifacts

      - name: Create Play release notes
        shell: bash
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          NOTES="${INPUT_NOTES:-NumoFi $VERSION_NAME}"
          printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-en-US
          printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-uk

      - name: Upload bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.financetracker
          releaseFiles: artifacts/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
          releaseName: ${{ needs.build.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew
