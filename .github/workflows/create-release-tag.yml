name: Create release tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is required. Create a fine-grained PAT with Contents: write; if main is protected, the token must be allowed to bypass it."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump appVersionName and create tag
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          CURRENT=$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '\r')
          if ! printf '%s' "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::gradle.properties appVersionName must be MAJOR.MINOR.PATCH, was '$CURRENT'."
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Unknown bump type '$BUMP'."; exit 1 ;;
          esac

          NEXT_CODE=$((MAJOR * 1_000_000 + MINOR * 1_000 + PATCH))
          if [ "$MAJOR" -gt 2100 ] || [ "$MINOR" -gt 999 ] || [ "$PATCH" -gt 999 ] || [ "$NEXT_CODE" -gt 2100000000 ]; then
            echo "::error::Version $MAJOR.$MINOR.$PATCH produces versionCode $NEXT_CODE, outside the supported range. Bump a higher component."
            exit 1
          fi

          NEXT="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEXT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Tags are immutable; choose the next version."
            exit 1
          fi

          sed -i "s/^appVersionName=.*/appVersionName=$NEXT/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"

          # Atomic: either main and the tag both move, or neither does. A half-pushed release
          # would leave main claiming a version whose tag never existed.
          git push --atomic origin "HEAD:main" "refs/tags/$TAG"

          {
            echo "### Released $TAG"
            echo ""
            echo "Version: \`$NEXT\`"
            echo ""
            echo "The tag workflow now builds the signed APK/AAB and creates the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
