# Project-local, portable across machines (no absolute paths).
# Required: this project depends on AndroidX (androidx.*, com.google.android.material).
android.useAndroidX=true

# Single source of truth for the app version. The release tag must match this value.
appVersionName=1.0.0
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
